<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Багратион · Интерактивная игра</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b120f;
    --panel:#131e19;
    --panel2:#1a2822;
    --gold:#c9a227;
    --gold-l:#e8cf74;
    --parch:#f2e8d5;
    --ink:#241f16;
    --ok:#3f9c68;
    --bad:#b3453e;
    --line:rgba(201,162,39,.28);
  }
  html,body{height:100%}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:
      radial-gradient(ellipse at 50% -10%, #1d3128 0%, transparent 60%),
      radial-gradient(ellipse at 50% 120%, #16241d 0%, transparent 60%),
      var(--bg);
    color:var(--parch);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:22px 14px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:820px}

  /* ---------- ШАПКА ---------- */
  .top{
    display:flex;align-items:center;gap:16px;
    padding-bottom:14px;margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .crest{width:52px;height:52px;flex:0 0 auto}
  .top h1{
    font-size:20px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:400;color:var(--gold-l);
  }
  .top p{font-size:12.5px;opacity:.6;letter-spacing:.06em;margin-top:2px}
  .score{
    margin-left:auto;text-align:right;font-size:13px;line-height:1.5;
    color:var(--gold);white-space:nowrap;
  }
  .score b{font-size:22px;font-weight:400;display:block;line-height:1}

  /* ---------- ПРОГРЕСС ---------- */
  .progress{height:3px;background:rgba(201,162,39,.15);border-radius:2px;overflow:hidden;margin-bottom:24px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6f18,var(--gold-l));
    transition:width .45s cubic-bezier(.2,.8,.3,1)}

  /* ---------- КАРТОЧКА ---------- */
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
    border-radius:4px;
    padding:26px 26px 24px;
    position:relative;
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    animation:in .38s ease both;
  }
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card::before{
    content:'';position:absolute;inset:7px;border:1px solid rgba(201,162,39,.13);
    border-radius:2px;pointer-events:none;
  }
  .meta{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
    margin-bottom:16px;
  }
  .meta span{padding:3px 9px;border:1px solid var(--line);border-radius:2px}
  .meta .place{border:none;padding-left:0;opacity:.75}
  .q{font-size:20.5px;line-height:1.55;margin-bottom:22px}
  .q em{color:var(--gold-l);font-style:italic}

  /* ---------- ВАРИАНТЫ ---------- */
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    font-family:inherit;font-size:16px;line-height:1.45;text-align:left;
    color:var(--parch);
    background:rgba(255,255,255,.025);
    border:1px solid rgba(201,162,39,.22);
    border-radius:3px;padding:14px 16px 14px 46px;
    cursor:pointer;position:relative;
    transition:.16s ease;
  }
  .opt::before{
    content:attr(data-k);
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;
    border:1px solid var(--line);
    display:grid;place-items:center;
    font-size:11.5px;color:var(--gold);letter-spacing:0;
  }
  .opt:hover:not(:disabled){background:rgba(201,162,39,.09);border-color:var(--gold);transform:translateX(3px)}
  .opt:disabled{cursor:default}
  .opt.ok{background:rgba(63,156,104,.16);border-color:var(--ok);color:#d9f2e3}
  .opt.ok::before{border-color:var(--ok);color:var(--ok)}
  .opt.bad{background:rgba(179,69,62,.14);border-color:var(--bad);color:#f3d9d7}
  .opt.bad::before{border-color:var(--bad);color:var(--bad)}
  .opt.dim{opacity:.4}

  /* ---------- ХРОНОЛОГИЯ ---------- */
  .pool{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;min-height:44px}
  .chip{
    font-family:inherit;font-size:14.5px;color:var(--parch);
    background:rgba(255,255,255,.03);border:1px solid rgba(201,162,39,.25);
    border-radius:3px;padding:9px 14px;cursor:pointer;transition:.16s;
  }
  .chip:hover{background:rgba(201,162,39,.12);border-color:var(--gold)}
  .slots{display:flex;flex-direction:column;gap:7px}
  .slot{
    display:flex;align-items:center;gap:12px;
    border:1px dashed rgba(201,162,39,.22);border-radius:3px;
    padding:11px 14px;font-size:15px;min-height:44px;
  }
  .slot .num{
    width:22px;height:22px;flex:0 0 auto;border-radius:50%;
    display:grid;place-items:center;font-size:11.5px;
    background:rgba(201,162,39,.14);color:var(--gold);
  }
  .slot .ph{opacity:.25}
  .slot.filled{border-style:solid;border-color:rgba(201,162,39,.5);background:rgba(201,162,39,.06);cursor:pointer}
  .slot.filled:hover{border-color:var(--bad)}
  .slot.ok{border-color:var(--ok);background:rgba(63,156,104,.14)}
  .slot.bad{border-color:var(--bad);background:rgba(179,69,62,.12)}

  /* ---------- РАЗБОР ---------- */
  .feedback{
    margin-top:20px;padding:18px 20px;border-radius:3px;
    background:rgba(0,0,0,.28);border-left:3px solid var(--gold);
    animation:in .3s ease both;
  }
  .feedback.good{border-left-color:var(--ok)}
  .feedback.bad{border-left-color:var(--bad)}
  .verdict{
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold);margin-bottom:9px;
  }
  .feedback.good .verdict{color:var(--ok)}
  .feedback.bad .verdict{color:var(--bad)}
  .feedback p{font-size:15.5px;line-height:1.66;opacity:.94}
  .feedback p b{color:var(--gold-l);font-weight:400}

  /* ---------- КНОПКИ ---------- */
  .btn{
    display:block;width:100%;margin-top:20px;
    font-family:inherit;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
    color:#12180f;background:linear-gradient(180deg,var(--gold-l),var(--gold));
    border:none;border-radius:3px;padding:16px;cursor:pointer;
    transition:.18s;font-weight:700;
  }
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn:disabled{opacity:.3;cursor:not-allowed;transform:none;filter:none}
  .btn.ghost{
    background:transparent;color:var(--gold);border:1px solid var(--line);
    font-weight:400;
  }
  .btn.ghost:hover{background:rgba(201,162,39,.1)}

  /* ---------- СТАРТ / ФИНАЛ ---------- */
  .hero{text-align:center;padding:20px 10px 6px}
  .hero .crest{width:92px;height:92px;margin:0 auto 20px}
  .hero h2{font-size:32px;font-weight:400;letter-spacing:.06em;color:var(--gold-l);margin-bottom:6px}
  .hero .sub{font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.55;margin-bottom:22px}
  .hero p{font-size:16px;line-height:1.7;opacity:.85;max-width:560px;margin:0 auto 14px;text-align:left}
  .hero p.center{text-align:center}
  .divider{height:1px;background:var(--line);margin:24px 0}

  .rank{
    text-align:center;padding:14px 0 6px;
  }
  .rank .val{
    font-size:44px;color:var(--gold-l);letter-spacing:.04em;line-height:1.15;
    margin-bottom:6px;
  }
  .rank .pts{font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}

  .review{list-style:none;margin-top:8px;font-size:14.5px;line-height:1.5}
  .review li{
    display:flex;gap:11px;align-items:flex-start;
    padding:9px 0;border-bottom:1px solid rgba(201,162,39,.1);
  }
  .review li:last-child{border-bottom:none}
  .review .mark{flex:0 0 auto;width:18px;text-align:center;font-size:14px}
  .review .mark.y{color:var(--ok)}
  .review .mark.n{color:var(--bad)}
  .review .t{opacity:.85}
  .review .t small{display:block;opacity:.5;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}

  .foot{text-align:center;font-size:12px;opacity:.35;margin-top:26px;letter-spacing:.08em}

  @media(max-width:560px){
    .top h1{font-size:16px}
    .q{font-size:18px}
    .card{padding:20px 17px}
    .hero h2{font-size:25px}
    .rank .val{font-size:32px}
  }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#c9a227" stroke-width="1.6"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#c9a227" stroke-width=".6" opacity=".5"/>
      <path d="M18 74 L82 26 M18 26 L82 74" stroke="#c9a227" stroke-width=".8" opacity=".25"/>
      <text x="50" y="63" text-anchor="middle" font-size="36" fill="#c9a227"
            font-family="Georgia,serif" letter-spacing="1">ПБ</text>

      <h1>Багратион</h1>

</div>

<script>
/* =========================================================
   ДАННЫЕ ИГРЫ

function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

        <p>Генерал от инфантерии, ученик Суворова, герой Шенграбена и Бородина.
           Его называли «генералом боя» — человеком, который всегда шёл впереди.</p>
        <p>Эта игра — не экзамен, а путешествие по его жизни. Двенадцать вопросов:
           биография, подвиг, характер, свидетельства современников, артефакты,
           образ в искусстве и места памяти.</p>
        <p class="center" style="opacity:.55;font-size:14px">
          Отвечайте, читайте разбор — и соберите свой чин.
        </p>
        <button class="btn" id="go">Начать</button>
      </div>
    </div>`;
  document.getElementById('go').onclick = () => {
    S.i=0; S.score=0; S.log=[];
    scoreEl.textContent='0';
    renderRound();
  };
}

/* =========================================================
   ВОПРОС
   ========================================================= */
function renderRound(){
  S.answered = false;
  const r = ROUNDS[S.i];
  S.picked = [];
  bar.style.width = (S.i/ROUNDS.length*100)+'%';

  const head = `
    <div class="meta">
      <span>${esc(r.topic)}</span>
      <span class="place">${esc(r.year)} · ${esc(r.place)}</span>
      <span style="margin-left:auto;border:none;opacity:.5">${S.i+1} / ${ROUNDS.length}</span>
    </div>
    <div class="q">${esc(r.q)}</div>`;

  if(r.kind === 'choice'){
    screen.innerHTML = `
      <div class="card">
        ${head}
        <div class="opts" id="opts"></div>
        <div id="fb"></div>
      </div>`;
    const box = document.getElementById('opts');
    r.options.forEach((o,idx)=>{
      const b = document.createElement('button');
      b.className='opt';
      b.dataset.k = KEYS[idx];
      b.textContent = o;
      b.onclick = ()=> answerChoice(idx, b);
      box.appendChild(b);
    });
  }
  else if(r.kind === 'order'){
    S.pool = shuffle(r.items.map((t,i)=>({t,i})));
    screen.innerHTML = `
      <div class="card">
        ${head}
        <div class="pool" id="pool"></div>
        <div class="slots" id="slots"></div>
        <button class="btn" id="check" disabled>Проверить</button>
        <div id="fb"></div>
      </div>`;
    document.getElementById('check').onclick = answerOrder;
    drawOrder();
  }
}

/* ---------- вариант ответа ---------- */
function answerChoice(idx, btn){
  if(S.answered) return;
  S.answered = true;
  const r = ROUNDS[S.i];
  const ok = idx === r.correct;

  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled = true;
    if(i === r.correct) b.classList.add('ok');
    else if(i === idx)  b.classList.add('bad');
    else b.classList.add('dim');
  });

  if(ok){ S.score++; scoreEl.textContent = S.score; }
  S.log.push({topic:r.topic, ok});

  document.getElementById('fb').innerHTML = feedbackHTML(ok, r.fact);
  document.getElementById('next').onclick = next;
}

/* ---------- хронология ---------- */
function drawOrder(){
  const r = ROUNDS[S.i];
  const pool = document.getElementById('pool');
  const slots= document.getElementById('slots');
  if(!pool || !slots) return;

  pool.innerHTML='';
  S.pool.forEach(o=>{
    if(S.picked.includes(o.i)) return;
    const b=document.createElement('button');
    b.className='chip';
    b.textContent=o.t;
    b.onclick=()=>{ S.picked.push(o.i); drawOrder(); };
    pool.appendChild(b);
  });

  slots.innerHTML='';
  for(let k=0;k<r.items.length;k++){
    const d=document.createElement('div');
    if(k < S.picked.length){
      const oi = S.picked[k];
      d.className='slot filled';
      d.innerHTML=`<span class="num">${k+1}</span><span>${esc(r.items[oi])}</span>`;
      d.onclick=()=>{ S.picked.splice(k,1); drawOrder(); };
    }else{
      d.className='slot';
      d.innerHTML=`<span class="num">${k+1}</span><span class="ph">выберите событие</span>`;
    }
    slots.appendChild(d);
  }
  const btn = document.getElementById('check');
  if(btn) btn.disabled = S.picked.length !== r.items.length;
}

function answerOrder(){
  if(S.answered) return;
  S.answered = true;
  const r = ROUNDS[S.i];
  const ok = S.picked.every((v,i)=> v === i);

  document.querySelectorAll('.slot').forEach((el,i)=>{
    el.classList.add(S.picked[i] === i ? 'ok' : 'bad');
    el.onclick = null;
  });
  const btn = document.getElementById('check');
  btn.disabled = true;
  btn.style.display = 'none';
  document.querySelectorAll('.chip').forEach(c=>c.remove());

  if(ok){ S.score++; scoreEl.textContent = S.score; }
  S.log.push({topic:r.topic, ok});

  document.getElementById('fb').innerHTML = feedbackHTML(ok, r.fact);
  document.getElementById('next').onclick = next;
}

/* ---------- разбор ---------- */
function feedbackHTML(ok, fact){
  return `
    <div class="feedback ${ok?'good':'bad'}">
      <div class="verdict">${ok ? '◆ Верно' : '◇ Неверно'}</div>
      <p>${esc(fact)}</p>
    </div>
    <button class="btn" id="next">${S.i === ROUNDS.length-1 ? 'Итог' : 'Далее'}</button>`;
}

function next(){
  S.i++;
  if(S.i >= ROUNDS.length) renderEnd();
  else renderRound();
}

/* =========================================================
   ФИНАЛ
   ========================================================= */
function renderEnd(){
  bar.style.width='100%';
  const rank = RANKS.find(r => S.score >= r.min);
  const pct  = Math.round(S.score/ROUNDS.length*100);

  const review = S.log.map(l=>`
    <li>
      <span class="mark ${l.ok?'y':'n'}">${l.ok?'✦':'✧'}</span>
      <span class="t">${esc(l.topic)}<small>${l.ok?'верно':'стоит повторить'}</small></span>
    </li>`).join('');

  screen.innerHTML = `
    <div class="card">
      <div class="rank">
        <div class="val">${esc(rank.name)}</div>
        <div class="pts">${S.score} из ${ROUNDS.length} · ${pct}%</div>
      </div>
      <div class="feedback good" style="border-left-color:var(--gold)">
        <div class="verdict" style="color:var(--gold)">◆ Ваш результат</div>
        <p>${esc(rank.note)}</p>
      </div>
      <div class="divider"></div>
      <div class="meta" style="margin-bottom:6px"><span>Разбор</span></div>
      <ul class="review">${review}</ul>
      <button class="btn" id="again">Пройти снова</button>
      <button class="btn ghost" id="about">О Багратионе</button>
    </div>`;
  document.getElementById('again').onclick = renderStart;
  document.getElementById('about').onclick = renderAbout;
}

function renderAbout(){
  bar.style.width='100%';
  screen.innerHTML = `
    <div class="card">
      <div class="meta"><span>Справка</span><span class="place">Пётр Иванович Багратион</span></div>
      <div class="q" style="font-size:19px">Кто он такой</div>
      <div class="feedback" style="border-left-color:var(--gold)">
        <p><b>Происхождение.</b> Из грузинского княжеского рода Багратиони. Родился в Кизляре,
        в семье полковника русской службы.</p>
        <p style="margin-top:12px"><b>Путь.</b> С 1783 года — в Астраханском пехотном полку.
        Очаков (1788), Польша (1794), Итальянский и Швейцарский походы Суворова (1799).</p>
        <p style="margin-top:12px"><b>Подвиг.</b> Шенграбен (1805): 6 тысяч против 30 тысяч —
        задержал врага и вывел отряд из окружения. Орден Святого Георгия 2-й степени.</p>
        <p style="margin-top:12px"><b>1812 год.</b> Командующий 2-й Западной армией.
        Бородино — левый фланг, смертельное ранение. Умер 24 сентября 1812 года в селе Сима.</p>
        <p style="margin-top:12px"><b>Память.</b> Прах перенесён на Бородинское поле (1839).
        Памятники в Москве и Санкт-Петербурге. Имя — в названии операции «Багратион» (1944).</p>
        <p style="margin-top:12px"><b>Характер.</b> Прост в обращении, доступен солдату,
        всегда впереди. Суворов называл его «наиотличнейшим генералом».</p>
      </div>
      <button class="btn" id="back">К итогам</button>
    </div>`;
  document.getElementById('back').onclick = renderEnd;
}

/* =========================================================
   КЛАВИАТУРА
   ========================================================= */
document.addEventListener('keydown', e=>{
  const r = ROUNDS[S.i];
  if(!r || S.answered){
    if(e.key === 'Enter'){
      const n = document.getElementById('next') || document.getElementById('again');
      if(n){ e.preventDefault(); n.click(); }
    }
    return;
  }
  if(r.kind === 'choice'){
    const n = parseInt(e.key,10);
    if(n >= 1 && n <= r.options.length){
      const btns = document.querySelectorAll('.opt');
      if(btns[n-1]) btns[n-1].click();
    }
  }
});

/* =========================================================
   СТАРТ ИГРЫ
   ========================================================= */
renderStart();
</script>
</body>
</html>
